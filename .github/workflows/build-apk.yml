name: Build PyRunner APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Unpacking: $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          if [ ! -f src/settings.gradle.kts ]; then
            INNER=$(find src -maxdepth 2 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$INNER" ]; then
              mv "$(dirname "$INNER")" src_tmp
              rm -rf src && mv src_tmp src
            fi
          fi
          ls src/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('src/**/*.gradle.kts') }}

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyRunner-APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
